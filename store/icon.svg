<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6fe8"/>
      <stop offset="1" stop-color="#1f3f9e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gloss)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- picked element: a small card with a green pick outline -->
  <g transform="translate(64 64)">
    <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#0f1f4d" fill-opacity="0.55" filter="url(#soft)"/>
    <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#ffffff"/>
    <rect x="-12" y="-5" width="17" height="3.5" rx="1.75" fill="#3b6fe8" fill-opacity="0.9"/>
    <rect x="-12" y="2" width="11" height="3.5" rx="1.75" fill="#3b6fe8" fill-opacity="0.45"/>
    <rect x="-22.5" y="-16.5" width="45" height="33" rx="8.5" fill="none" stroke="#5fe0a0" stroke-width="3.5"/>
  </g>

  <!-- reticle: four ticks, gapped so the element breathes -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M64 18v12"/>
    <path d="M64 98v12"/>
    <path d="M18 64h12"/>
    <path d="M98 64h12"/>
  </g>
  <!-- corner arcs -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M40 24.5A44 44 0 0 0 24.5 40"/>
    <path d="M88 24.5A44 44 0 0 1 103.5 40"/>
    <path d="M40 103.5A44 44 0 0 1 24.5 88"/>
    <path d="M88 103.5A44 44 0 0 0 103.5 88"/>
  </g>
</svg>
