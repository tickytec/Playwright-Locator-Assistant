<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playwright Locator</title>
    <style>
        :root {
            color-scheme: light dark;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            --surface: #ffffff; --surface-2: #f1f3f6; --text: #1c2430; --text-2: #4b5563; --text-3: #7b8594;
            --hair: rgba(16,24,40,0.10); --hair-strong: rgba(16,24,40,0.18);
            --accent: #2f6fed; --accent-ink: #fff; --focus: rgba(47,111,237,0.35);
            --ok: #1e7f4c; --ok-soft: rgba(30,127,76,0.12); --warn: #9a6400; --warn-soft: rgba(201,138,0,0.14); --bad: #c0392b; --bad-soft: rgba(192,57,43,0.12);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1c2027; --surface-2: #242932; --text: #e6e9ee; --text-2: #b4bcc8; --text-3: #7f8896;
                --hair: rgba(255,255,255,0.09); --hair-strong: rgba(255,255,255,0.16);
                --accent: #5b8def; --accent-ink: #0b1220; --focus: rgba(91,141,239,0.45);
                --ok: #6cc796; --ok-soft: rgba(108,199,150,0.16); --warn: #e6b451; --warn-soft: rgba(230,180,81,0.16); --bad: #f0857a; --bad-soft: rgba(240,133,122,0.16);
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px 14px; font: 12px/1.45 var(--font); color: var(--text); background: var(--surface); -webkit-font-smoothing: antialiased; }
        code { font: 11.5px/1.55 var(--mono); word-break: break-all; white-space: pre-wrap; user-select: all; }
        .main { display: flex; gap: 8px; align-items: flex-start; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
        .main code { flex: 1; min-width: 0; }
        .count, .stab { flex: 0 0 auto; display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font: 600 10.5px var(--font); font-variant-numeric: tabular-nums; }
        .count.ok { color: var(--ok); background: var(--ok-soft); } .count.many { color: var(--warn); background: var(--warn-soft); } .count.zero { color: var(--bad); background: var(--bad-soft); }
        .stab { border: 1px solid currentColor; letter-spacing: 0.02em; }
        .stab.strong { color: var(--ok); } .stab.good { color: var(--warn); } .stab.fragile { color: var(--bad); }
        .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; align-items: center; }
        button { height: 26px; padding: 0 10px; font: 600 11px var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 6px; cursor: pointer; }
        button:hover { background: var(--surface-2); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
        #copy { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
        select { height: 26px; margin-left: auto; padding: 0 8px; font: 11px var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 6px; }
        .muted { color: var(--text-3); font-size: 11px; }
        .alt { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--hair); font-size: 11px; }
        .alt code { flex: 1; min-width: 0; color: var(--text-2); }
        .lbl { color: var(--text-3); font-size: 10.5px; flex: 0 0 auto; min-width: 80px; }
        details { margin-top: 10px; }
        details summary { cursor: pointer; color: var(--text-3); font-size: 11px; list-style: none; }
        details summary::before { content: "▸ "; }
        details[open] summary::before { content: "▾ "; }
        pre.snippet { margin: 6px 0 0; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; color: var(--text-2); }
        pre.snippet[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="empty" class="muted">Select an element in the Elements panel.</div>
    <div id="result" hidden>
        <div class="main"><code id="locator"></code><span id="stability" class="stab"></span><span id="count" class="count"></span></div>
        <div id="column" class="muted" hidden></div>
        <div class="row">
            <button id="copy">Copy</button>
            <button id="copyAction">Copy action</button>
            <button id="copyAssert">Copy assert</button>
            <select id="framework" aria-label="Language">
                <option value="pytest">Python</option>
                <option value="js">JS / TS</option>
                <option value="java">Java</option>
                <option value="csharp">C#</option>
            </select>
        </div>
        <pre id="action" class="snippet"></pre>
        <pre id="assertion" class="snippet"></pre>
        <details><summary id="altSummary">Alternatives</summary><div id="alternatives"></div></details>
    </div>
    <div id="error" class="muted" hidden></div>
    <script src="sidebar.js"></script>
</body>
</html>
